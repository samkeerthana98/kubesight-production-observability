suite: poddisruptionbudget
release:
  name: test-release
templates:
  - pdb.yaml
tests:
  - it: should be a PodDisruptionBudget for API
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: test-release-kubesight-api-pdb
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
      - equal:
          path: metadata.labels['app.kubernetes.io/component']
          value: api
      - equal:
          path: spec.minAvailable
          value: 1
  - it: should be a PodDisruptionBudget for Frontend
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: test-release-kubesight-frontend-pdb
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
      - equal:
          path: metadata.labels['app.kubernetes.io/component']
          value: frontend
      - equal:
          path: spec.minAvailable
          value: 1
  - it: should be a PodDisruptionBudget for Redis
    documentIndex: 2
    asserts:
      - equal:
          path: kind
          value: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: test-release-kubesight-redis-pdb
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
      - equal:
          path: metadata.labels['app.kubernetes.io/component']
          value: redis
      - equal:
          path: spec.minAvailable
          value: 1
