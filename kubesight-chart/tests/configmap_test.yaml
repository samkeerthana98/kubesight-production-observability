suite: configmap
release:
  name: test-release
templates:
  - configmap.yaml
tests:
  - it: should be a ConfigMap
    asserts:
      - equal:
          path: kind
          value: ConfigMap
  - it: should have the correct name
    asserts:
      - equal:
          path: metadata.name
          value: test-release-kubesight-config
