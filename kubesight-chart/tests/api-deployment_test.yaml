suite: api deployment
release:
  name: test-release
  values:
    replicaCount: 1
templates:
  - api-deployment.yaml
tests:
  - it: should be a Deployment
    asserts:
      - equal:
          path: kind
          value: Deployment
  - it: should have the correct name
    asserts:
      - equal:
          path: metadata.name
          value: test-release-kubesight-api
  - it: should have the correct labels
    asserts:
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
  - it: should have the correct replica count
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: should have the correct selector labels
    asserts:
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/instance']
          value: test-release
  - it: should have the correct template labels
    asserts:
      - equal:
          path: spec.template.metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: spec.template.metadata.labels['app.kubernetes.io/instance']
          value: test-release
  - it: should have the correct container image
    assumes:
      - key: .Values.api.image.repository
        value: DockerHub/kubesight/api
      - key: .Values.api.image.tag
        value: latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: kubesight/api:latest
  - it: should have the correct container port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5000
