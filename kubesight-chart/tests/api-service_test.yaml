suite: api service
release:
  name: test-release
  values:
    replicaCount: 1
templates:
  - api-service.yaml
tests:
  - it: should be a Service
    asserts:
      - equal:
          path: kind
          value: Service
  - it: should have the correct name
    asserts:
      - equal:
          path: metadata.name
          value: test-release-kubesight-api
  - it: should have the correct labels
    asserts:
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
  - it: should have the correct port
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 5000
  - it: should have the correct target port
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 5000
