ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: kubesight.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: kubesight-tls
      hosts:
        - kubesight.example.com
  backend:
    serviceName: frontend
    servicePort: 5000
