suite: redis service
release:
  name: test-release
templates:
  - redis-service.yaml
tests:
  - it: should be a Service
    asserts:
      - equal:
          path: kind
          value: Service
  - it: should have the correct name
    asserts:
      - equal:
          path: metadata.name
          value: test-release-kubesight-redis
  - it: should have the correct labels
    asserts:
      - equal:
          path: metadata.labels['app.kubernetes.io/name']
          value: kubesight
      - equal:
          path: metadata.labels['app.kubernetes.io/instance']
          value: test-release
      - equal:
          path: metadata.labels['app.kubernetes.io/component']
          value: redis
  - it: should have the correct port
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6379
  - it: should have the correct target port
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 6379
