suite: secret
release:
  name: test-release
templates:
  - secret.yaml
tests:
  - it: should be a Secret
    asserts:
      - equal:
          path: kind
          value: Secret
  - it: should have the correct name
    asserts:
      - equal:
          path: metadata.name
          value: test-release-kubesight-secret
  - it: should have the correct JWT_SECRET
    set:
      secret.JWT_SECRET: "test-jwt-secret"
    asserts:
      - equal:
          path: stringData.JWT_SECRET
          value: test-jwt-secret
  - it: should have the correct REDIS_PASSWORD
    set:
      secret.REDIS_PASSWORD: "test-redis-password"
    asserts:
      - equal:
          path: stringData.REDIS_PASSWORD
          value: test-redis-password