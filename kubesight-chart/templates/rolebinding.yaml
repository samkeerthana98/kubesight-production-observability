{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubesight.fullname" . }}-rolebinding
  labels:
    {{- include "kubesight.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubesight.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kubesight.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}