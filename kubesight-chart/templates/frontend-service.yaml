---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubesight.fullname" . }}-frontend
  labels:
    {{- include "kubesight.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "kubesight.selectorLabels" . | nindent 6 }}
    {{- "app.kubernetes.io/component: frontend" | nindent 6 }}