# Development values for kubesight chart
replicaCount: 1

image:
  registry: DockerHub
  repository: kubesight
  pullIfNotPresent: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Monitoring configuration
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false

# Grafana Dashboard configuration
grafanaDashboard:
  enabled: true
  namespace: monitoring  # Namespace where Grafana is installed

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - kubesight
        topologyKey: kubernetes.io/hostname

# Common environment variables for all components
common:
  VERBOSE: "true"
  VERSION: "1.0.0-dev"
  COMMIT_SHA: "dev"
  ENVIRONMENT: "development"

# Secret values
secret:
  JWT_SECRET: "dev-secret-change-me"
  REDIS_PASSWORD: "dev-redis-pass"

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Configuration for each component
redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    existingClaim: ""

api:
  image:
    repository: kubesight/api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 30
  lifecycle:
    enabled: false
    preStop: {}
    postStart: {}

frontend:
  image:
    repository: kubesight/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: []
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 30
  lifecycle:
    enabled: false
    preStop: {}
    postStart: {}

apm:
  enabled: false

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  backend:
    serviceName: frontend
    servicePort: 5000

# NetworkPolicy configuration
networkPolicy:
  enabled: false

# PodDisruptionBudget configuration
pdb:
  enabled: true
  minAvailable: 1

# Topology spread constraints configuration
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: kubesight

# Deployment strategy configuration
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# RBAC configuration
rbac:
  create: true

# PriorityClass configuration
priorityClassName: ""

# DNS configuration
dnsPolicy: "ClusterFirst"
dnsConfig: {}

# Init containers
initContainers: []

# Host aliases
hostAliases: []

# Termination grace period
terminationGracePeriodSeconds: 30

# Test connection configuration
testConnection:
  enabled: true