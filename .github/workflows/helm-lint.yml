name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'kubesight-chart/**'
      - '.github/workflows/helm-lint.yml'
      - 'app/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'kubesight-chart/**'
      - '.github/workflows/helm-lint.yml'
      - 'app/**'

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Helm Lint – Default Values
        run: |
          echo "=== Running helm lint with default values ==="
          helm lint ./kubesight-chart

      - name: Helm Lint – Dev Values
        run: |
          echo "=== Running helm lint with dev values ==="
          helm lint ./kubesight-chart -f ./kubesight-chart/values-dev.yaml

      - name: Helm Lint – Production Values
        run: |
          echo "=== Running helm lint with production values ==="
          helm lint ./kubesight-chart -f ./kubesight-chart/values-production.yaml

  helm-template:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    needs: helm-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Helm Template – Default Values
        run: |
          echo "=== Rendering templates with default values ==="
          helm template kubesight ./kubesight-chart

      - name: Helm Template – Dev Values
        run: |
          echo "=== Rendering templates with dev values ==="
          helm template kubesight ./kubesight-chart -f ./kubesight-chart/values-dev.yaml

      - name: Helm Template – Production Values
        run: |
          echo "=== Rendering templates with production values ==="
          helm template kubesight ./kubesight-chart -f ./kubesight-chart/values-production.yaml

      - name: Verify Key Resources Rendered
        run: |
          echo "=== Verifying key resources are present in rendered output ==="
          OUTPUT=$(helm template kubesight ./kubesight-chart -f ./kubesight-chart/values-production.yaml)

          echo "Checking for Deployment..."
          echo "$OUTPUT" | grep -q "kind: Deployment" && echo "✓ Deployment found" || (echo "✗ Deployment missing" && exit 1)

          echo "Checking for Service..."
          echo "$OUTPUT" | grep -q "kind: Service" && echo "✓ Service found" || (echo "✗ Service missing" && exit 1)

          echo "Checking for ServiceMonitor..."
          echo "$OUTPUT" | grep -q "kind: ServiceMonitor" && echo "✓ ServiceMonitor found" || (echo "✗ ServiceMonitor missing" && exit 1)

          echo "Checking for PrometheusRule..."
          echo "$OUTPUT" | grep -q "kind: PrometheusRule" && echo "✓ PrometheusRule found" || (echo "✗ PrometheusRule missing" && exit 1)

          echo "Checking for Grafana Dashboard ConfigMap..."
          echo "$OUTPUT" | grep -q "grafana_dashboard" && echo "✓ Grafana Dashboard ConfigMap found" || (echo "✗ Grafana Dashboard ConfigMap missing" && exit 1)

          echo "Checking for HorizontalPodAutoscaler..."
          echo "$OUTPUT" | grep -q "kind: HorizontalPodAutoscaler" && echo "✓ HPA found" || (echo "✗ HPA missing" && exit 1)

          echo "Checking for PodDisruptionBudget..."
          echo "$OUTPUT" | grep -q "kind: PodDisruptionBudget" && echo "✓ PDB found" || (echo "✗ PDB missing" && exit 1)

          echo "Checking for NetworkPolicy..."
          echo "$OUTPUT" | grep -q "kind: NetworkPolicy" && echo "✓ NetworkPolicy found" || (echo "✗ NetworkPolicy missing" && exit 1)

          echo ""
          echo "=== All resource checks passed ==="

  kubeconform:
    name: Kubeconform Validation
    runs-on: ubuntu-latest
    needs: helm-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Install Kubeconform
        run: |
          wget -qO- https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          echo "=== Validating Kubernetes manifests with kubeconform ==="
          helm template kubesight ./kubesight-chart -f ./kubesight-chart/values-production.yaml | kubeconform -ignore-missing-schemas -kubernetes-version 1.28.0 -strict

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  kubesec:
    name: Kubesec Security Validation
    runs-on: ubuntu-latest
    needs: helm-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Install Kubesec
        run: |
          wget -qO- https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz | tar xz
          chmod +x kubesec
          sudo mv kubesec /usr/local/bin/

      - name: Render Production Manifests
        run: |
          helm template kubesight ./kubesight-chart -f ./kubesight-chart/values-production.yaml > /tmp/production-manifests.yaml

      - name: Run Kubesec Security Validation
        run: |
          echo "=== Running kubesec security validation ==="
          kubesec scan /tmp/production-manifests.yaml || echo "Kubesec scan completed with warnings (non-blocking)"

  docker-build:
    name: Docker Build & Image Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Git commit SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build API Docker image
        run: |
          echo "=== Building API Docker image ==="
          docker build -t kubesight-api:${{ steps.vars.outputs.sha_short }} ./app/api

      - name: Build Frontend Docker image
        run: |
          echo "=== Building Frontend Docker image ==="
          docker build -t kubesight-frontend:${{ steps.vars.outputs.sha_short }} ./app/frontend

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kubesight-api:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kubesight-frontend:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
